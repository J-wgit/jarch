# shellcheck shell=bash
# Jarch install settings. Override per machine in ~/.config/jarch/jarch.conf
# (same syntax; that file is sourced after this one).

# Profiles applied when --profile isn't given. "base" is always included.
DEFAULT_PROFILES=(base desktop)

# AUR helper to bootstrap and use: paru or yay
AUR_HELPER=paru

# pacman.conf tweaks applied by the preflight stage
PACMAN_COLOR=1
PACMAN_PARALLEL_DOWNLOADS=10
PACMAN_ILOVECANDY=1
ENABLE_MULTILIB=0

# Login shell for your user (must be installed by a profile)
LOGIN_SHELL=/bin/bash

# [jarch] pacman repo: Jarch's own tools and custom builds of upstream packages
# (pkgbuilds/), built and published by CI. If the repo can't be reached, the
# installer builds the packages it needs from pkgbuilds/ locally instead.
JARCH_REPO=1
# shellcheck disable=SC2016  # $arch is expanded by pacman, not the shell
JARCH_REPO_SERVER='https://github.com/J-wgit/jarch/releases/download/repo-$arch'
# List [jarch] above [core] so its custom builds replace the official ones.
# 0 puts it last: only packages the official repos don't have come from it.
# Only honoured while signatures are required (keys/jarch.asc exists): an
# unsigned [jarch] always goes last so it can't shadow official packages.
JARCH_REPO_FIRST=1
# Empty = automatic: "Required DatabaseOptional" once keys/jarch.asc exists in
# the repo (CI is signing), otherwise "Optional TrustAll" (unsigned).
JARCH_REPO_SIGLEVEL=
