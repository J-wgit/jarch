# shellcheck shell=bash
# Jarch install settings. Override per machine in ~/.config/jarch/jarch.conf
# (same syntax; that file is sourced after this one).

# Profiles applied when --profile isn't given. "base" is always included.
DEFAULT_PROFILES=(base desktop)

# AUR helper to bootstrap and use: paru or yay
AUR_HELPER=paru

# pacman.conf tweaks applied by the preflight stage
PACMAN_COLOR=1
PACMAN_PARALLEL_DOWNLOADS=10
PACMAN_ILOVECANDY=1
ENABLE_MULTILIB=0

# Login shell for your user (must be installed by a profile)
LOGIN_SHELL=/bin/bash
