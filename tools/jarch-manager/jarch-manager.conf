# jarch-manager settings, system-wide. Each user can override them in
# ~/.config/jarch-manager/config (same syntax; read after this file).
# `jarch-manager config` shows the values in use.

# Where package lists and config backups are written
#BACKUP_DIR=/var/backups/arch-manager

# Where system reports and boot charts are written (default: your home)
#REPORT_DIR=/home/you/reports

# Package versions kept by "clean-cache" option 1
#CACHE_KEEP=3

# AUR helper for AUR update checks: paru or yay (default: whichever is installed, paru first)
#AUR_HELPER=paru
