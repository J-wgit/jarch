name: Conventions

on:
  pull_request:

jobs:
  conventions:
    # Conventional Commits and a prefixed branch name, the two conventions agents
    # can check for themselves before a human looks (see AGENTS.md).
    name: commits + branch name
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Branch is prefixed by who drives it
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          echo "$BRANCH" | grep -Eq '^(claude|codex|cursor|copilot|feat|fix|chore|docs|refactor|test|ci|build|perf|hotfix|release|dependabot)/' \
            || { echo "branch '$BRANCH' needs a prefix like claude/ or feat/"; exit 1; }
      - name: Every commit is a Conventional Commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          bad=0
          while IFS= read -r subject; do
            if ! echo "$subject" | grep -Eq '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .+'; then
              echo "not a Conventional Commit: $subject"; bad=1
            fi
          done < <(git log --no-merges --format=%s "$BASE..$HEAD")
          exit $bad
